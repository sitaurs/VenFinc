name: Quality
on: [pull_request, push]
permissions:
  contents: read
jobs:
  local-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:security
      - name: Report docs-check Python version
        run: python3 --version
      - name: Validate handoff documents
        run: |
          set +e
          python3 --version > "$RUNNER_TEMP/docs-check-python.txt"
          python3 tools/validate_handoff.py > "$RUNNER_TEMP/validate-handoff.json" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/validate-handoff.json" <<'PY'
          import json, sys
          try:
              result = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("::error title=handoff-validator::Validator failed before producing JSON output")
              raise SystemExit(0)
          issues = result.get("issues", [])
          if not issues:
              print("::error title=handoff-validator::Validator returned a failing result without issue details")
          for issue in issues:
              tag = str(issue.get("tag", "unknown")).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              detail = str(issue.get("detail", "")).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=handoff:{tag}::{detail}")
          PY
          fi
          {
            echo '### Handoff document validator'
            echo '```text'
            cat "$RUNNER_TEMP/docs-check-python.txt"
            echo '```'
            echo '```json'
            cat "$RUNNER_TEMP/validate-handoff.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/validate-handoff.json"
          exit "$status"
      - name: Validate execution tracker
        run: |
          set +e
          python3 --version > "$RUNNER_TEMP/docs-check-python.txt"
          python3 tools/check_execution.py > "$RUNNER_TEMP/check-execution.json" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/check-execution.json" <<'PY'
          import json, sys
          try:
              result = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              print("::error title=execution-validator::Validator failed before producing JSON output")
              raise SystemExit(0)
          issues = result.get("issues", [])
          if not issues:
              print("::error title=execution-validator::Validator returned a failing result without issue details")
          for issue in issues:
              tag = str(issue.get("tag", "unknown")).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              detail = str(issue.get("detail", "")).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=execution:{tag}::{detail}")
          PY
          fi
          {
            echo '### Execution tracker validator'
            echo '```text'
            cat "$RUNNER_TEMP/docs-check-python.txt"
            echo '```'
            echo '```json'
            cat "$RUNNER_TEMP/check-execution.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/check-execution.json"
          exit "$status"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        if: failure() && hashFiles('test-results/**') != ''
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
# Live provider checks require a separate trusted workflow and disposable scoped
# resources after P0 gates. No provider secret is supplied to this workflow.
